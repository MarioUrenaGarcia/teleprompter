<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 544" width="1280" height="544" role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">Funciones</title>
  <desc id="features-desc">Invisible al compartir, desplazamiento suave, pantalla completa, PDF Word y Markdown con OCR, todo ajustable y atajos globales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F21"/>
      <stop offset="1" stop-color="#141A38"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161C33"/>
      <stop offset="1" stop-color="#10152A"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="544" rx="28"/></clipPath>
    <clipPath id="linesClip"><rect x="10" y="12" width="36" height="32" rx="4"/></clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .rise { opacity: 0; animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; }
    .d1 { animation-delay: 0.05s; }
    .d2 { animation-delay: 0.15s; }
    .d3 { animation-delay: 0.25s; }
    .d4 { animation-delay: 0.35s; }
    .d5 { animation-delay: 0.45s; }
    .d6 { animation-delay: 0.55s; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }

    .slash { stroke-dasharray: 40; animation: slash 3s ease-in-out infinite; }
    @keyframes slash { 0%, 15% { stroke-dashoffset: 40; } 45%, 75% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 40; } }

    .lines { animation: lines 1.1s linear infinite; }
    @keyframes lines { from { transform: translateY(0); } to { transform: translateY(-10px); } }

    .c1 { animation: c1 2.4s ease-in-out infinite; }
    .c2 { animation: c2 2.4s ease-in-out infinite; }
    .c3 { animation: c3 2.4s ease-in-out infinite; }
    .c4 { animation: c4 2.4s ease-in-out infinite; }
    @keyframes c1 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, -4px); } }
    @keyframes c2 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, -4px); } }
    @keyframes c3 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(4px, 4px); } }
    @keyframes c4 { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-4px, 4px); } }

    .beam { animation: beam 2.2s ease-in-out infinite alternate; }
    @keyframes beam { from { transform: translateY(0); } to { transform: translateY(31px); } }

    .k1 { animation: k1 3s ease-in-out infinite; }
    .k2 { animation: k2 3s ease-in-out infinite; }
    .k3 { animation: k3 3s ease-in-out infinite; }
    @keyframes k1 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes k2 { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(14px); } }
    @keyframes k3 { 0%, 100% { transform: translateY(0); } 33% { transform: translateY(-9px); } 66% { transform: translateY(8px); } }

    .press { animation: press 1.8s ease-in-out infinite; }
    @keyframes press { 0%, 30%, 100% { transform: translateY(0); } 12% { transform: translateY(3px); } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise { opacity: 1; }
      .slash { stroke-dashoffset: 0; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="544" fill="url(#bg)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="543" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- 1. Invisible al compartir -->
  <g transform="translate(40 40)">
    <g class="rise d1">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#6EE79A" fill-opacity="0.12" stroke="#6EE79A" stroke-opacity="0.35"/>
        <g fill="none" stroke="#6EE79A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 28 Q28 12 46 28 Q28 44 10 28 Z"/>
          <circle cx="28" cy="28" r="6"/>
          <path class="slash" d="M14 42 L42 14"/>
        </g>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">Invisible al compartir</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Teams, Zoom, Meet, OBS y las capturas</tspan><tspan x="28" y="186">de pantalla no lo ven.</tspan></text>
    </g>
  </g>

  <!-- 2. Desplazamiento suave -->
  <g transform="translate(448 40)">
    <g class="rise d2">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#5CE1E6" fill-opacity="0.12" stroke="#5CE1E6" stroke-opacity="0.35"/>
        <rect x="9" y="23.5" width="38" height="10" rx="3" fill="#5CE1E6" fill-opacity="0.22"/>
        <g clip-path="url(#linesClip)">
          <g class="lines" fill="#5CE1E6">
            <rect x="14" y="16.5" width="28" height="3" rx="1.5"/>
            <rect x="14" y="26.5" width="28" height="3" rx="1.5"/>
            <rect x="14" y="36.5" width="28" height="3" rx="1.5"/>
            <rect x="14" y="46.5" width="28" height="3" rx="1.5"/>
          </g>
        </g>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">Desplazamiento suave</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Automático con cuenta regresiva, o</tspan><tspan x="28" y="186">manual con rueda, teclado o barra.</tspan></text>
    </g>
  </g>

  <!-- 3. Pantalla completa -->
  <g transform="translate(856 40)">
    <g class="rise d3">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#8B9CFF" fill-opacity="0.12" stroke="#8B9CFF" stroke-opacity="0.35"/>
        <g fill="none" stroke="#8B9CFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path class="c1" d="M16 24 V16 H24"/>
          <path class="c2" d="M32 16 H40 V24"/>
          <path class="c3" d="M40 32 V40 H32"/>
          <path class="c4" d="M24 40 H16 V32"/>
        </g>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">Pantalla completa</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Ocupa todo el monitor o flota en una</tspan><tspan x="28" y="186">ventana del tamaño que quieras.</tspan></text>
    </g>
  </g>

  <!-- 4. Documentos -->
  <g transform="translate(40 284)">
    <g class="rise d4">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#FFC83D" fill-opacity="0.12" stroke="#FFC83D" stroke-opacity="0.35"/>
        <g fill="none" stroke="#FFC83D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 10 H33 L41 18 V46 H17 Z"/>
          <path d="M33 10 V18 H41"/>
          <path d="M22 26 H36 M22 32 H36 M22 38 H31" stroke-opacity="0.6" stroke-width="2"/>
        </g>
        <rect class="beam" x="13" y="12" width="32" height="2.5" rx="1.25" fill="#FFC83D"/>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">PDF, Word y Markdown</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Arrastra tu documento. Los PDF</tspan><tspan x="28" y="186">escaneados se leen con OCR.</tspan></text>
    </g>
  </g>

  <!-- 5. Ajustes -->
  <g transform="translate(448 284)">
    <g class="rise d5">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#FF8AD8" fill-opacity="0.12" stroke="#FF8AD8" stroke-opacity="0.35"/>
        <g stroke="#FF8AD8" stroke-opacity="0.45" stroke-width="2.2" stroke-linecap="round">
          <path d="M18 13 V43 M28 13 V43 M38 13 V43"/>
        </g>
        <g fill="#FF8AD8">
          <circle class="k1" cx="18" cy="32" r="4.4"/>
          <circle class="k2" cx="28" cy="20" r="4.4"/>
          <circle class="k3" cx="38" cy="28" r="4.4"/>
        </g>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">Todo ajustable</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Fuente, tamaño, colores, opacidad,</tspan><tspan x="28" y="186">franja de lectura y modo espejo.</tspan></text>
    </g>
  </g>

  <!-- 6. Atajos globales -->
  <g transform="translate(856 284)">
    <g class="rise d6">
      <rect width="384" height="220" rx="20" fill="url(#cardFill)" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <g transform="translate(28 28)">
        <rect width="56" height="56" rx="14" fill="#FF9F5A" fill-opacity="0.12" stroke="#FF9F5A" stroke-opacity="0.35"/>
        <path d="M13 44 H43" stroke="#FF9F5A" stroke-opacity="0.5" stroke-width="2.4" stroke-linecap="round"/>
        <g class="press">
          <rect x="11" y="13" width="34" height="27" rx="6" fill="#FF9F5A" fill-opacity="0.18" stroke="#FF9F5A" stroke-width="2"/>
          <text x="28" y="31" text-anchor="middle" font-size="11" font-weight="700" fill="#FF9F5A">Ctrl</text>
        </g>
      </g>
      <text x="28" y="128" font-size="22" font-weight="700" fill="#FFFFFF">Atajos globales</text>
      <text font-size="16" fill="#AEB6CF"><tspan x="28" y="160">Controla el texto aunque la</tspan><tspan x="28" y="186">videollamada tenga el foco.</tspan></text>
    </g>
  </g>
</svg>
